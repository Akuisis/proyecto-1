[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "titanic-ml"
version = "0.1.0"
description = "Titanic Machine Learning prediction project using modern tools"
authors = [{name = "Angel", email = "angel@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
    "kagglehub>=1.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
